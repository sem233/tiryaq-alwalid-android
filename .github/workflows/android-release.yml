name: Build Android APK & Create GitHub Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21 (Required for Capacitor Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Capacitor Android + Local Notifications
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0 @capacitor/local-notifications@^7.0.0 --save --legacy-peer-deps

      - name: Build Web Application Assets
        run: npm run build

      - name: Initialize & Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Permissions for Closed-App Alarms, Vibrate & Exact Screen Alignment
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<\/manifest>/  <uses-permission android:name="android.permission.VIBRATE" \/>\n  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n  <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n  <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n  <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n  <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n<\/manifest>/' "$MANIFEST"
          fi
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ]; then
            sed -i 's/<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">/<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">\n        <item name="android:fitsSystemWindows">true<\/item>\n        <item name="android:statusBarColor">#059669<\/item>\n        <item name="android:navigationBarColor">#ffffff<\/item>/' "$STYLES"
          fi

      - name: Build Installable Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Direct Phone Installation
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./tiryaq-alwalid-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiryaq-alwalid-android-apk
          path: ./tiryaq-alwalid-android.apk

      - name: Create GitHub Release with Direct APK Download Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ترياق الوالد - تطبيق أندرويد جاهز للتثبيت (v1.0.${{ github.run_number }})"
          body: |
            ## 📱 تطبيق ترياق الوالد للأندرويد (الإصدار المحدث v1.0.${{ github.run_number }})
            
            تم بناء حزمة الأندرويد المحدثة (`tiryaq-alwalid-android.apk`) بنجاح:
            - إزالة كافة نصوص وتعليمات التثبيت من واجهة التطبيق ليكون نظيفاً بالكامل.
            - دعم إرسال الإشعارات القوية تلقائياً حتى والتطبيق مغلق تماماً عبر نظام إنذار أندرويد (`AlarmManager` + `LocalNotifications`).
            - إمكانية اختيار أي رنة أو ملف صوتي من الهاتف مباشرة ليصدح بأعلى صوت عند التنبيه.
            - ضبط محاذاة أبعاد شاشة الهاتف وشريط الحالة العلوي والسفلي بدقة.
            
            ### 📥 رابط التحميل المباشر للتثبيت على الهاتف:
            اضغط على ملف **`tiryaq-alwalid-android.apk`** في قسم **Assets** بالأسفل لتحميله وتثبيته مباشرة على الهاتف.
          files: ./tiryaq-alwalid-android.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
