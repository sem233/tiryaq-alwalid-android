name: Build Android APK & Create GitHub Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21 (Required for Capacitor Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Capacitor Android + Local Notifications
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0 @capacitor/local-notifications@^7.0.0 --save --legacy-peer-deps

      - name: Build Web Application Assets
        run: npm run build

      - name: Initialize & Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inject Native Android AlarmManager, RingtoneManager & Closed-App BroadcastReceivers
        run: |
          JAVA_DIR="android/app/src/main/java/com/tiryaq/alwalid/app"
          mkdir -p "$JAVA_DIR"
          cp android-native/MainActivity.java "$JAVA_DIR/MainActivity.java"
          cp android-native/TiryaqNativeBridge.java "$JAVA_DIR/TiryaqNativeBridge.java"
          cp android-native/TiryaqAlarmReceiver.java "$JAVA_DIR/TiryaqAlarmReceiver.java"
          cp android-native/TiryaqBootReceiver.java "$JAVA_DIR/TiryaqBootReceiver.java"
          node android-native/patch-manifest.mjs

      - name: Build Installable Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Direct Phone Installation
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./tiryaq-alwalid-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiryaq-alwalid-android-apk
          path: ./tiryaq-alwalid-android.apk

      - name: Create GitHub Release with Direct APK Download Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ترياق الوالد - تطبيق أندرويد جاهز للتثبيت (v1.0.${{ github.run_number }})"
          body: |
            ## 📱 تطبيق ترياق الوالد للأندرويد (الإصدار المحدث v1.0.${{ github.run_number }})
            
            تم بناء حزمة الأندرويد المحدثة (`tiryaq-alwalid-android.apk`) بنجاح مع التحديثات الحرجة:
            - **إرسال الإشعارات والرنين حتى والتطبيق ميت ومغلق تماماً لأيام**: عبر محرك `AlarmManager.setAlarmClock` الأصلي في أندرويد ومستقبل `TiryaqAlarmReceiver` و `TiryaqBootReceiver` الذي يوقظ الهاتف في الموعد المحدد بالضبط.
            - **اختيار النغمة من نغمات ومنبهات الهاتف الرسمية المدعومة (`RingtoneManager`)**: يدعم اختيار أي نغمة رنين أو منبه مدمج في الهاتف وتشغيله عبر مسار صوت المنبهات (`USAGE_ALARM` + `FLAG_INSISTENT`).
            - **زر تجربة الإشعار والتطبيق مغلق تماماً (بعد 10 ثوانٍ)**: يمكنك الضغط على زر الاختبار ثم إغلاق التطبيق ومسحه من الخلفية للتأكد بنفسك من وصول الإشعار ورنين الهاتف بالنغمة التي اخترتها.
            
            ### 📥 رابط التحميل المباشر للتثبيت على الهاتف:
            اضغط على ملف **`tiryaq-alwalid-android.apk`** في قسم **Assets** بالأسفل لتحميله وتثبيته مباشرة على الهاتف.
          files: ./tiryaq-alwalid-android.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
